---
# Mirrors the devices: section of ../../inventory.yaml (the Python scripts'
# inventory) - same hosts, same IPs, kept in sync by hand since Ansible's
# inventory format and that YAML aren't directly compatible.
#
# Addresses are x.x.x.x placeholders: unlike ../../inventory.yaml, which is
# gitignored, this file is committed, so it must not carry a site's real
# addressing. Fill them in locally before running any play - Ansible will
# fail to resolve x.x.x.x rather than reach the wrong device.
all:
  children:
    l2_switches:
      hosts:
        S1:
          ansible_host: x.x.x.x
        S2:
          ansible_host: x.x.x.x
        S3:
          ansible_host: x.x.x.x
      vars:
        ansible_network_os: cisco.ios.ios
        ansible_connection: ansible.netcommon.network_cli
        ansible_become: true
        ansible_become_method: enable
    # The stig_audit role doesn't use these connection vars - it delegates to
    # localhost and shells out to nxos_stig_audit.py, which makes its own
    # Netmiko connection. They exist for the nxos_stig_harden role, which
    # talks to the device through Ansible directly (cisco.nxos.nxos_config).
    #
    # NX-OS has no enable/privileged mode to escalate into the way IOS does -
    # authorisation is role-based (RBAC) on the account itself - so there is
    # no ansible_become here, unlike l2_switches above.
    nxos_switches:
      hosts:
        NXCore1:
          ansible_host: x.x.x.x
        # NXCore2 is powered off - the GNS3 lab does not have the RAM to run
        # both NX-OS switches. Left in the inventory because it is a real part
        # of the topology, but any play targeting the whole group will fail
        # against it. Use `--limit NXCore1` for live runs.
        NXCore2:
          ansible_host: x.x.x.x
      vars:
        ansible_network_os: cisco.nxos.nxos
        ansible_connection: ansible.netcommon.network_cli
