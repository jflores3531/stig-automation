[defaults]
inventory = inventory/hosts.yml
roles_path = roles
host_key_checking = False
retry_files_enabled = False
# YAML-formatted task output. The standalone 'yaml' callback was built into
# Ansible 2.9, moved to community.general at the 2.10 collection split, and
# was removed there in 12.0.0 - superseded by result_format on the built-in
# default callback from ansible-core 2.13 on. So this needs no collection at
# all; `stdout_callback = yaml` fails with "Invalid callback for stdout" and
# the community.general.yaml FQCN fails as removed.
stdout_callback = default
result_format = yaml
interpreter_python = auto_silent

[persistent_connection]
# 90s, not the 30s this used to be. Once `aaa authentication login default group
# RADIUS_SERVERS` is active and the RADIUS servers are not actually reachable -
# which is the state of this lab, where the syslog/NTP hosts are the same two
# addresses named as RADIUS servers and run no RADIUS - every login waits out the RADIUS attempts before
# NX-OS falls back to local. Measured on NXCore1 2026-08-12: a full Netmiko
# login took 31 seconds, one second over the old limit, so NX-OS plays failed
# intermittently with
#
#   Failed to authenticate: Authentication timeout.
#
# while TCP 22 was open and Netmiko (which has a longer default timeout) worked
# fine from the same host. Failing by one second made it look like a flaky
# device rather than a configured limit.
#
# Raising this does not paper over a fault - the delay is the intended AAA
# fallback behaviour and the same delay a real operator sees at the CLI. The
# durable fixes are a reachable RADIUS server or a lower `radius-server
# timeout`; until then the client has to be patient enough to outlast it.
connect_timeout = 90
command_timeout = 60
