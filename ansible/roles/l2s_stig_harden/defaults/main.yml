---
# Fallback defaults - group_vars/l2_switches/{vars,vault}.yml normally
# supplies real values. These just let the role run without blowing up if
# reused for a group that doesn't set everything (features that depend on
# an empty value below are skipped, same "skip with a warning" behavior
# the Python scripts use).
non_user_vlans: [1]
unused_vlan: ""
native_vlan: ""
default_access_vlan: ""
ntp_servers: []
syslog_servers: []
vtp_password: ""
snmpv3_auth_password: ""
snmpv3_priv_password: ""
ntp_auth_key_id: ""
ntp_auth_key_value: ""

# V-220636 broadcast thresholds in bps, keyed by the alphabetic part of the
# interface name - the Ansible half of STORM_CONTROL_BPS in
# l2_stig_harden_access_ports.py, and it must stay in step with it. DISA's Fix
# Text only enumerates ranges for Gigabit (10M-1G) and 10-Gigabit (100M-10G)
# ports; the faster Catalyst 9000 types carry the same ~2%-of-line-rate rule
# forward. Anything unlisted - Port-channel, plain Ethernet - takes the default,
# since a bundled or negotiated speed isn't visible from the name.
storm_control_bps_by_prefix:
  TwoGigabitEthernet: 50000000
  FiveGigabitEthernet: 100000000
  TenGigabitEthernet: 200000000
  TwentyFiveGigE: 500000000
  FortyGigabitEthernet: 800000000
  HundredGigE: 2000000000
  TwoHundredGigE: 4000000000
  FourHundredGigE: 8000000000
storm_control_bps_default: 20000000
