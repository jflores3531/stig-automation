---
# Mirrors l2_stig_harden_global.py's parse_switchports()/access_fixes/trunk_fixes -
# an interface counts as trunk only if its block has 'switchport mode
# trunk'; everything else switchport-capable is access. NOT ported here,
# on purpose (see ../../../README.md for why):
#   - V-220629 (Root Guard) - needs live STP root-port detection
#     (stig_common.discover_root_port_interfaces) to safely exclude this
#     switch's own root port; pushing Root Guard there blindly can force a
#     real outage (root-inconsistent/blocking state).
#
# V-220641a (disabled ports -> unused VLAN) WAS in that list and is now
# implemented below - the per-port shutdown state it needs turned out to be
# readable from the running-config this role already gathers, no extra round
# trip required. Ported from l2_stig_harden_access_ports.py's
# shutdown_access_ports().

- name: Gather show running-config for interface classification
  cisco.ios.ios_command:
    commands:
      - show running-config
  register: running_config_result

- name: All switchport-capable interface names
  set_fact:
    all_switchports: >-
      {{
        running_config_result.stdout[0]
        | regex_findall('(?m)^interface ((?:GigabitEthernet|FastEthernet|TenGigabitEthernet|TwoGigabitEthernet|FiveGigabitEthernet|TwentyFiveGigE|FortyGigabitEthernet|HundredGigE|TwoHundredGigE|FourHundredGigE|Ethernet|Port-channel)\S*)')
      }}

- name: Trunk-classified interface names (block contains 'switchport mode trunk')
  set_fact:
    trunk_ports: >-
      {{
        running_config_result.stdout[0]
        | regex_findall('(?ms)^interface ((?:GigabitEthernet|FastEthernet|TenGigabitEthernet|TwoGigabitEthernet|FiveGigabitEthernet|TwentyFiveGigE|FortyGigabitEthernet|HundredGigE|TwoHundredGigE|FourHundredGigE|Ethernet|Port-channel)\S*)\n(?:(?!^interface \S).)*switchport mode trunk')
      }}

- name: Access-classified interface names (switchport-capable, not trunk)
  set_fact:
    access_ports: "{{ all_switchports | difference(trunk_ports) }}"

# NO ACCESS VLAN IS SET BY THIS ROLE - V-220641 and V-220642 both stay findings.
#
# Matching l2_stig_harden_access_ports.py. A port's access VLAN says what the
# thing plugged into it can reach, and neither this role nor that script knows
# what is plugged in. Bulk-assigning it moved the lab's own management port and
# cut the session pushing the change (2026-08-28).
#
# It could not reliably tell which ports already had one either: an access VLAN
# can come from a sourced interface template rather than the interface's own
# block, and the regex facts below read the block. A templated port therefore
# read as unassigned, and would have had the default VLAN written over the one
# its template gives it.
#
# WARNING, not yet fixed here: that same blindness applies to the trunk/access
# classification above. A port whose block is only `source template UPLINK` has
# no `switchport mode trunk` line of its own, so this role reads it as an access
# port and would send it `switchport mode access` and `spanning-tree portfast
# edge`, collapsing the uplink. The Python scripts now expand templates before
# classifying (stig_common.read_interface_templates); this role does not.
# Do not run it against a switch that uses interface templates.

- name: >-
    Common access-port fixes: access mode (V-220645),
    PortFast (V-220630b, required for BPDU Guard to activate)
  cisco.ios.ios_config:
    parents: "interface {{ item }}"
    lines:
      - switchport mode access
      # 'edge' for the same reason as the global bpduguard line in global.yml -
      # IOS 15.x normalises 'spanning-tree portfast' to 'spanning-tree portfast
      # edge' in running-config, so the bare form never matches and this task
      # re-pushed on every access port every run. The other two lines here were
      # already matching; this one line was the whole difference.
      - spanning-tree portfast edge
  loop: "{{ access_ports }}"
  when: access_ports | length > 0

# V-220632/623: confirmed live (see the project vault's Bugs/README.md) that UUFB and
# 802.1x/MAB are both rejected/nonfunctional on this lab's vios_l2 image
# (no 802.1x authenticator role at the interface level at all here). Kept
# for real hardware, split into their own ignore_errors task - bundling
# these with the task above would abort it entirely on the first rejected
# line, the same way the global BASE_FIXES batch did with mls qos (ios_config
# treats a rejected command as fatal, unlike Netmiko's send_config_set()).
#
# V-220623 (802.1x/MAB) is NOT pushed here, matching
# l2_stig_harden_access_ports.py. It used to be, skipping access ports on
# non-user VLANs after `authentication port-control auto` blocked the rebuilt
# S1's management port live (2026-08-28) - accepted and enforced even on
# vios_l2, where `dot1x pae authenticator`/`mab` are rejected. That skip
# treated a fleet-wide problem as a management-port problem: with no reachable
# RADIUS authenticator and no supplicant on the endpoint, port-control auto
# blocks every port it lands on, which on an access switch full of user devices
# is an outage rather than a hardening step. The audit's V-220623 stays strict
# and reports it as a finding, which is the honest outcome.

- name: "V-220632 (UUFB) - rejected on lab vios_l2, kept for real hardware"
  cisco.ios.ios_config:
    parents: "interface {{ item }}"
    lines:
      - switchport block unicast
  loop: "{{ access_ports }}"
  when: access_ports | length > 0
  ignore_errors: true

- name: >-
    V-220636 - storm control, threshold scaled to ~2% of link speed from the
    interface-name prefix (storm_control_bps_by_prefix); FastEthernet skipped
    entirely - not supported per the STIG's own Fix Text note. Confirmed live
    (Bugs/README.md) that the command itself is also rejected outright on
    this lab's vios_l2 - kept for real hardware.
  cisco.ios.ios_config:
    parents: "interface {{ item }}"
    lines:
      - "storm-control broadcast level bps {{ storm_control_bps_by_prefix[item | regex_search('^[A-Za-z-]+')] | default(storm_control_bps_default) }}"
  loop: "{{ access_ports | reject('match', '^FastEthernet') | list }}"
  when: access_ports | length > 0
  ignore_errors: true

- name: Build trunk-port fix lines (allowed-vlan/native-vlan only added if configured)
  set_fact:
    trunk_fix_lines: >-
      {{
        ['switchport nonegotiate', 'ip dhcp snooping trust', 'ip arp inspection trust']
        + (['switchport trunk allowed vlan ' ~ (allowed_trunk_vlan_ids | join(','))] if allowed_trunk_vlan_ids | length > 0 else [])
        + (['switchport trunk native vlan ' ~ native_vlan] if native_vlan | string | length > 0 else [])
      }}

- name: >-
    V-220640 (static trunk), V-220633b/635b (DHCP snooping + DAI trust),
    V-220643/641b (trunk VLAN scoping), V-220646 (native VLAN)
  cisco.ios.ios_config:
    parents: "interface {{ item }}"
    lines: "{{ trunk_fix_lines }}"
  loop: "{{ trunk_ports }}"
  when: trunk_ports | length > 0
