---
# Mirrors l2_stig_harden_global.py's parse_switchports()/access_fixes/trunk_fixes -
# an interface counts as trunk only if its block has 'switchport mode
# trunk'; everything else switchport-capable is access. NOT ported here,
# on purpose (see ../../../README.md for why):
#   - V-220629 (Root Guard) - needs live STP root-port detection
#     (stig_common.discover_root_port_interfaces) to safely exclude this
#     switch's own root port; pushing Root Guard there blindly can force a
#     real outage (root-inconsistent/blocking state).
#
# V-220641a (disabled ports -> unused VLAN) WAS in that list and is now
# implemented below - the per-port shutdown state it needs turned out to be
# readable from the running-config this role already gathers, no extra round
# trip required. Ported from l2_stig_harden_interfaces.py's
# shutdown_access_ports().

- name: Gather show running-config for interface classification
  cisco.ios.ios_command:
    commands:
      - show running-config
  register: running_config_result

- name: All switchport-capable interface names
  set_fact:
    all_switchports: >-
      {{
        running_config_result.stdout[0]
        | regex_findall('(?m)^interface ((?:GigabitEthernet|FastEthernet|TenGigabitEthernet|TwoGigabitEthernet|FiveGigabitEthernet|TwentyFiveGigE|FortyGigabitEthernet|HundredGigE|TwoHundredGigE|FourHundredGigE|Ethernet|Port-channel)\S*)')
      }}

- name: Trunk-classified interface names (block contains 'switchport mode trunk')
  set_fact:
    trunk_ports: >-
      {{
        running_config_result.stdout[0]
        | regex_findall('(?ms)^interface ((?:GigabitEthernet|FastEthernet|TenGigabitEthernet|TwoGigabitEthernet|FiveGigabitEthernet|TwentyFiveGigE|FortyGigabitEthernet|HundredGigE|TwoHundredGigE|FourHundredGigE|Ethernet|Port-channel)\S*)\n(?:(?!^interface \S).)*switchport mode trunk')
      }}

- name: Access-classified interface names (switchport-capable, not trunk)
  set_fact:
    access_ports: "{{ all_switchports | difference(trunk_ports) }}"

# V-220641a: access ports that are already administratively shut get parked on
# the designated unused VLAN instead of the normal default access VLAN.
#
# Detection is pure running-config here, unlike the NX-OS role's V-220690, which
# needs a `show interface status` round trip on top. That is not an oversight in
# either direction - it is the platforms differing. IOS renders `shutdown` in the
# interface block and that is sufficient; NX-OS does not render enough state
# there to distinguish an administratively shut port from other down states,
# which is why its equivalent reads the status table and cross-checks.
# `shutdown_access_ports()` in l2_stig_harden_interfaces.py uses exactly this
# running-config test.
#
# Matching `\n[ \t]*shutdown[ \t]*\n` rather than bare 'shutdown' so a `no
# shutdown` line cannot satisfy it, and [ \t] rather than \s because \s matches
# newlines and would let the match wander into the following interface's block.
- name: Administratively-shut access ports (V-220641a)
  set_fact:
    disabled_ports: >-
      {{
        running_config_result.stdout[0]
        | regex_findall('(?ms)^interface ((?:GigabitEthernet|FastEthernet|TenGigabitEthernet|TwoGigabitEthernet|FiveGigabitEthernet|TwentyFiveGigE|FortyGigabitEthernet|HundredGigE|TwoHundredGigE|FourHundredGigE|Ethernet|Port-channel)\S*)\n(?:(?!^interface \S).)*?\n[ \t]*shutdown[ \t]*\n')
        | intersect(access_ports)
      }}
  when: unused_vlan | string | length > 0

# Access ports that already carry an explicit access VLAN other than 1. These
# were assigned deliberately and keep their VLAN - V-220642 only requires
# host-facing ports off VLAN 1, not on any particular VLAN, and the Python's
# unassigned_access_ports() applies the same rule. The rule earned its place
# on the rebuilt lab (2026-08-28): re-VLANing every access port moved S1's
# Gi0/0 - the management uplink to the automation host - and cut the very
# session pushing the change.
- name: Access ports with a deliberate VLAN assignment (kept as-is)
  set_fact:
    assigned_ports: >-
      {{
        running_config_result.stdout[0]
        | regex_findall('(?ms)^interface ((?:GigabitEthernet|FastEthernet|TenGigabitEthernet|TwoGigabitEthernet|FiveGigabitEthernet|TwentyFiveGigE|FortyGigabitEthernet|HundredGigE|TwoHundredGigE|FourHundredGigE|Ethernet|Port-channel)\S*)\n(?:(?!^interface \S).)*?^[ \t]*switchport access vlan (?!1[ \t]*$)\d+[ \t]*$')
        | intersect(access_ports)
      }}

# Disabled ports are excluded from this loop and handled by their own task
# below. The Python pushes the default access VLAN and then overrides it for
# the disabled subset, which is harmless there because Netmiko never diffs -
# but in Ansible those two tasks would fight, each reporting changed forever
# and genuinely re-writing the VLAN twice on every run. Removing them here
# reaches the same end state without the churn.
- name: >-
    Common access-port fixes: access mode (V-220645),
    PortFast (V-220630b, required for BPDU Guard to activate)
  cisco.ios.ios_config:
    parents: "interface {{ item }}"
    lines:
      - switchport mode access
      # 'edge' for the same reason as the global bpduguard line in global.yml -
      # IOS 15.x normalises 'spanning-tree portfast' to 'spanning-tree portfast
      # edge' in running-config, so the bare form never matches and this task
      # re-pushed on every access port every run. The other two lines here were
      # already matching; this one line was the whole difference.
      - spanning-tree portfast edge
  loop: "{{ access_ports | difference(disabled_ports | default([])) }}"
  when: access_ports | difference(disabled_ports | default([])) | length > 0

# The default VLAN only lands on ports still on VLAN 1 - explicitly or by
# having no 'switchport access vlan' line at all (V-220642).
#
# The default_access_vlan guard is not decoration. This role's own defaults set
# it to "" (see defaults/main.yml: an unset value means skip the feature, the
# same convention the Python scripts use), and every other task that
# interpolates a VLAN ID checks for that - V-220641a via disabled_ports, which
# is only computed when unused_vlan is set, and the trunk native-VLAN task
# inline. This one did not, so an inventory that left default_access_vlan unset
# would push a bare `switchport access vlan` to every unassigned access port on
# the device. Nothing in the lab hit it because the group_vars always carried a
# value; emptying that file to keep site numbering out of the repo is exactly
# the case it was waiting for.
- name: "V-220642 - move unassigned access ports off the default VLAN"
  cisco.ios.ios_config:
    parents: "interface {{ item }}"
    lines:
      - "switchport access vlan {{ default_access_vlan }}"
  loop: "{{ access_ports | difference(disabled_ports | default([])) | difference(assigned_ports) }}"
  when:
    - default_access_vlan | string | length > 0
    - access_ports | difference(disabled_ports | default([])) | difference(assigned_ports) | length > 0

# Same three lines as the task above, but landing on unused_vlan rather than
# default_access_vlan. Kept as a separate task rather than a conditional inside
# the loop above because ios_config takes one `lines:` list per task - the
# duplication is the cost of not re-writing the VLAN twice per run.
- name: "V-220641a - park administratively-shut access ports on the unused VLAN"
  cisco.ios.ios_config:
    parents: "interface {{ item }}"
    lines:
      - switchport mode access
      - "switchport access vlan {{ unused_vlan }}"
      - spanning-tree portfast edge
  loop: "{{ disabled_ports | default([]) }}"
  when: disabled_ports | default([]) | length > 0

# V-220632/623: confirmed live (see the project vault's Bugs/README.md) that UUFB and
# 802.1x/MAB are both rejected/nonfunctional on this lab's vios_l2 image
# (no 802.1x authenticator role at the interface level at all here). Kept
# for real hardware, split into their own ignore_errors task - bundling
# these with the task above would abort it entirely on the first rejected
# line, the same way the global BASE_FIXES batch did with mls qos (ios_config
# treats a rejected command as fatal, unlike Netmiko's send_config_set()).
#
# Correction to an earlier claim here that 802.1x is wholly rejected on
# vios_l2: `dot1x pae authenticator`/`mab` are rejected, but `authentication
# port-control auto` alone is accepted AND enforced - it blocked the rebuilt
# S1's management port live (2026-08-28). So the 802.1x/MAB lines skip access
# ports on non-user VLANs (management/infrastructure per inventory), same rule
# as the Python's mgmt_vlan_ports exemption. The audit's V-220623 stays strict
# and reports those ports as a known/accepted finding.
- name: Access ports on non-user VLANs (802.1x would lock out the management host)
  set_fact:
    mgmt_vlan_ports: >-
      {{
        running_config_result.stdout[0]
        | regex_findall('(?ms)^interface ((?:GigabitEthernet|FastEthernet|TenGigabitEthernet|TwoGigabitEthernet|FiveGigabitEthernet|TwentyFiveGigE|FortyGigabitEthernet|HundredGigE|TwoHundredGigE|FourHundredGigE|Ethernet|Port-channel)\S*)\n(?:(?!^interface \S).)*?^[ \t]*switchport access vlan (?:' ~ (non_user_vlans | map('string') | join('|')) ~ ')[ \t]*$')
        | intersect(access_ports)
      }}

- name: "V-220632 (UUFB) - rejected on lab vios_l2, kept for real hardware"
  cisco.ios.ios_config:
    parents: "interface {{ item }}"
    lines:
      - switchport block unicast
  loop: "{{ access_ports }}"
  when: access_ports | length > 0
  ignore_errors: true

- name: >-
    V-220623 (802.1x/MAB) - never on non-user-VLAN ports; port-control auto
    is enforced even where dot1x pae/mab are rejected
  cisco.ios.ios_config:
    parents: "interface {{ item }}"
    lines:
      - authentication port-control auto
      - dot1x pae authenticator
      - mab
  loop: "{{ access_ports | difference(mgmt_vlan_ports) }}"
  when: access_ports | difference(mgmt_vlan_ports) | length > 0
  ignore_errors: true

- name: >-
    V-220636 - storm control, threshold scaled to ~2% of link speed from the
    interface-name prefix (storm_control_bps_by_prefix); FastEthernet skipped
    entirely - not supported per the STIG's own Fix Text note. Confirmed live
    (Bugs/README.md) that the command itself is also rejected outright on
    this lab's vios_l2 - kept for real hardware.
  cisco.ios.ios_config:
    parents: "interface {{ item }}"
    lines:
      - "storm-control broadcast level bps {{ storm_control_bps_by_prefix[item | regex_search('^[A-Za-z-]+')] | default(storm_control_bps_default) }}"
  loop: "{{ access_ports | reject('match', '^FastEthernet') | list }}"
  when: access_ports | length > 0
  ignore_errors: true

- name: Build trunk-port fix lines (allowed-vlan/native-vlan only added if configured)
  set_fact:
    trunk_fix_lines: >-
      {{
        ['switchport nonegotiate', 'ip dhcp snooping trust', 'ip arp inspection trust']
        + (['switchport trunk allowed vlan ' ~ (allowed_trunk_vlan_ids | join(','))] if allowed_trunk_vlan_ids | length > 0 else [])
        + (['switchport trunk native vlan ' ~ native_vlan] if native_vlan | string | length > 0 else [])
      }}

- name: >-
    V-220640 (static trunk), V-220633b/635b (DHCP snooping + DAI trust),
    V-220643/641b (trunk VLAN scoping), V-220646 (native VLAN)
  cisco.ios.ios_config:
    parents: "interface {{ item }}"
    lines: "{{ trunk_fix_lines }}"
  loop: "{{ trunk_ports }}"
  when: trunk_ports | length > 0
