---
# Mirrors stig_common.discover_user_vlans() + l2_stig_harden_global.py's VLAN
# database creation and DHCP snooping push. VLAN database creation uses
# the cisco.ios.ios_vlans resource module (state-based); everything else
# here still uses raw ios_config lines - most of this bulk pass has no
# matching resource module at all (STIG-specific commands like exec-timeout,
# storm-control, etc. aren't general-purpose config domains Cisco built
# structured support for).

- name: Gather show vlan brief
  cisco.ios.ios_command:
    commands:
      - show vlan brief
  register: vlan_brief_result

- name: >-
    Discover genuine user VLANs (excludes non_user_vlans and the reserved
    fddi/token-ring 1002-1005 range) - for DHCP snooping (V-220633)
  set_fact:
    user_vlan_ids: >-
      {{
        vlan_brief_result.stdout[0]
        | regex_findall('(?m)^(\d+)\s+\S+')
        | map('int')
        | reject('in', non_user_vlans | map('int') | list)
        | reject('in', range(1002, 1006) | list)
        | map('string')
        | list
      }}

# Excludes VLAN 1, unused_vlan AND native_vlan, matching
# l2_stig_harden_trunk_ports.py's trunk_vlan_exclude. native_vlan was missing
# here: it used to share an ID with unused_vlan, so excluding one covered
# both, and the two were later split (999/1000) without this being updated -
# leaving 999 swept into the allowed-list once it existed in the database.
# non_user_vlans is deliberately NOT excluded - management/servers VLANs must
# still cross trunks.
- name: >-
    Discover VLANs for trunk allowed-list (excludes VLAN 1, unused_vlan and
    native_vlan) - for V-220643/641b in interfaces.yml
  set_fact:
    allowed_trunk_vlan_ids: >-
      {{
        vlan_brief_result.stdout[0]
        | regex_findall('(?m)^(\d+)\s+\S+')
        | map('int')
        | reject('in', [1]
                       + ([unused_vlan | int] if unused_vlan | string | length > 0 else [])
                       + ([native_vlan | int] if native_vlan | string | length > 0 else []))
        | reject('in', range(1002, 1006) | list)
        | map('string')
        | list
      }}

- name: >-
    VTP transparent mode - VLAN database entries live in a separate vlan.dat
    file under VTP server mode (the Cisco default) and don't survive a
    reload; confirmed live that this is required for native_vlan/
    default_access_vlan to actually persist
  cisco.ios.ios_config:
    lines:
      - vtp mode transparent
  when: (native_vlan | string | length > 0) or (default_access_vlan | string | length > 0)

# V-220646/default access VLAN - uses the ios_vlans resource module instead
# of raw ios_config lines: state the desired VLANs as data (id + name) and
# let the module work out what to actually push, rather than hand-writing
# 'vlan <id>' / 'name <name>' ourselves. state: merged adds/updates these
# two VLANs without touching any other VLAN already in the database.
- name: "V-220646/default access VLAN - create both VLANs in the database"
  cisco.ios.ios_vlans:
    config: >-
      {{
        ([{'vlan_id': native_vlan | int, 'name': 'NATIVE'}] if native_vlan | string | length > 0 else [])
        + ([{'vlan_id': default_access_vlan | int, 'name': 'USER'}] if default_access_vlan | string | length > 0 else [])
      }}
    state: merged
  when: (native_vlan | string | length > 0) or (default_access_vlan | string | length > 0)

- name: "V-220633 - DHCP snooping for discovered user VLANs"
  cisco.ios.ios_config:
    lines:
      - ip dhcp snooping
      - "ip dhcp snooping vlan {{ user_vlan_ids | join(',') }}"
      - no ip dhcp snooping information option
  when: user_vlan_ids | length > 0
